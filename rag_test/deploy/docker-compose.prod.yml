services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhisuo}
      POSTGRES_USER: ${POSTGRES_USER:-zhisuo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhisuo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhisuo} -d ${POSTGRES_DB:-zhisuo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER:-zhisuo}:${POSTGRES_PASSWORD:-zhisuo}@postgres:5432/${POSTGRES_DB:-zhisuo}
      CONSOLE_USER: ${CONSOLE_USER:-admin}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-change-me-strong}
      USER_MANAGEMENT_ENABLED: ${USER_MANAGEMENT_ENABLED:-true}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://host.docker.internal:9380}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY}
      RAGFLOW_DATASET_ID: ${RAGFLOW_DATASET_ID}
      ES_URL: ${ES_URL:-http://host.docker.internal:1200}
      ES_USER: ${ES_USER:-elastic}
      ES_PASSWORD: ${ES_PASSWORD}
      RAGFLOW_PARSE_TIMEOUT_MS: ${RAGFLOW_PARSE_TIMEOUT_MS:-3600000}
      RAGFLOW_PDF_PART_PAGES: ${RAGFLOW_PDF_PART_PAGES:-30}
      INDEX_WORKER_CONCURRENCY: ${INDEX_WORKER_CONCURRENCY:-2}
      WORD_REVIEW_MAX_PARAGRAPHS: ${WORD_REVIEW_MAX_PARAGRAPHS:-120}
      WORD_REVIEW_MAX_LLM_CALLS: ${WORD_REVIEW_MAX_LLM_CALLS:-12}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-524288000}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  app-data:
  caddy-data:
  caddy-config:
